{% set version = "0.0.5" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-drr
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/DRR_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/DRR/DRR_{{ version }}.tar.gz
  sha256: f4427980dbf7c3ed12c51b166a0fe1feab9f930e2de47bb003ae005958317f96

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
  host:
    - r-base
    - r-cvst
    - r-matrix
    - r-kernlab
  run:
    - r-base
    - r-cvst
    - r-matrix
    - r-kernlab

test:
  commands:
    - $R -e "library('DRR')"           # [not win]
    - "\"%R%\" -e \"library('DRR')\""  # [win]

about:
  home: https://github.com/gdkrmr/DRR
  license: GPL-3.0-only
  summary: An Implementation of Dimensionality Reduction via Regression using Kernel Ridge Regression.
  license_family: GPL3
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r

